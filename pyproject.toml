[build-system]
requires = [
    "setuptools>=77.0.3",
    "setuptools-scm>=8.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "sora-astro"
description = "Stellar Occultation Reduction Analysis"
requires-python = ">=3.11, <4"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "SORA Team", email = "rio.occteam@gmail.com" },
]
maintainers = [
    { name = "Altair R. Gomes-Júnior", email = "altairgomesjr@gmail.com" },
]
dynamic = ["version"]
keywords = ["science", "astronomy", "occultation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=2.2",
    "pyerfa>=2.0",
    "astropy>=7.0",
    "jplephem>=2.13",
    "astroquery>=0.4.9",
    "spiceypy>=6.0.0",
    "matplotlib>=3.10.0",
    "scipy>=1.15",
    "requests",
    "tqdm>=4.66",
    "shapely>=2.0.7",
    "cartopy>=0.24",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-doctestplus",
]
docs = [
    "ipython",
    "Sphinx==8.*",
    "nbsphinx",
    "sphinx-automodapi",
    "sphinx-issues",
    "sphinx-rtd-theme",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-youtube",
]

[project.urls]
Repository = "https://github.com/riogroup/SORA"
Documentation = "https://sora.readthedocs.io/"
Issues = "https://github.com/riogroup/SORA/issues"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["sora*"]
exclude = ["sora._dev*"]
namespaces = false

[tool.setuptools_scm]
version_file = "sora/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "sora",
    "docs",
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"

[tool.coverage.run]
omit = [
    "sora/__init*",
    "sora/conftest.py",
    "sora/*setup_package*",
    "sora/tests/*",
    "sora/*/tests/*",
    "sora/extern/*",
    "sora/version*",
    "*/sora/__init*",
    "*/sora/conftest.py",
    "*/sora/*setup_package*",
    "*/sora/tests/*",
    "*/sora/*/tests/*",
    "*/sora/extern/*",
    "*/sora/version*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "def main(.*):",
    "pragma: py{ignore_python_version}",
    "if TYPE_CHECKING:",
    "@overload",
]
