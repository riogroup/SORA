# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS and Python version used to build the documentation
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - pandoc

# Install SORA and the optional dependencies declared for documentation
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  builder: "html"
  fail_on_warning: false

# Optionally build your docs in additional formats such as PDF
formats:
  - pdf

# By default readthedocs does not checkout git submodules
submodules:
  include: all
